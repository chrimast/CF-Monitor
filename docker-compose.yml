services:
  cf-monitor:
    build: .
    container_name: cf-monitor
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      API_SECRET: ${API_SECRET:-changeme}
      API_USER_NAME: ${API_USER_NAME:-admin}
      PORT: "8787"
      HOST: "0.0.0.0"
      CF_MONITOR_DB: /data/cf-monitor.sqlite
    volumes:
      - cf-monitor-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  cf-monitor-data:
