name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "cf-monitor"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true

          [triggers]
          crons = ["*/1 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "cf-monitor-db"
          database_id = "D1_PLACEHOLDER"

          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[durable_objects.bindings]]
          name = "TERMINAL_HUB"
          class_name = "TerminalHub"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          [[migrations]]
          tag = "v2"
          new_sqlite_classes = ["TerminalHub"]
          WEOF
          sed -i 's/^          //' wrangler.toml
          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            API_SECRET
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
