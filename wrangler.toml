# Cloudflare Workers 配置，线上已由deploy.yml接管，这里仅供本地测试
name = "cf-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 定时任务：只挂 1 条每分钟触发器（Workers 免费套餐全账号最多 5 条）。
# 离线/告警、到期/优选 的实际执行间隔在后台设置里自定义，scheduled() 按表达式过滤。
[triggers]
crons = ["*/1 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cf-monitor-db"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[durable_objects.bindings]]
name = "TERMINAL_HUB"
class_name = "TerminalHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TerminalHub"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
